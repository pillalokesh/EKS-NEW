# Velero Helm Values

image:
  repository: velero/velero
  tag: v1.13.0

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.9.0
    volumeMounts:
      - mountPath: /target
        name: plugins

configuration:
  provider: aws
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: ${bucket}
      default: true
      config:
        region: ${region}
  volumeSnapshotLocation:
    - name: default
      provider: aws
      config:
        region: ${region}

serviceAccount:
  server:
    create: true
    name: velero
    annotations:
      eks.amazonaws.com/role-arn: ${role_arn}

schedules:
  daily-backup:
    disabled: false
    schedule: "0 2 * * *"
    template:
      ttl: "720h"
      includedNamespaces:
        - "*"
      excludedNamespaces:
        - kube-system
        - monitoring
        - logging

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
